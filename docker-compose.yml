# ShopSmart local-dev compose stack.
# PRODUCTION NOTES (do not deploy as-is):
# - Set DJANGO_SECRET_KEY, DB_PASSWORD, and (if SMTP is used) EMAIL_HOST_PASSWORD
#   explicitly; never rely on the dev fallbacks below.
# - Restrict DJANGO_ALLOWED_HOSTS to the real domain (no "*").
# - Do not publish Postgres (5432) or use the default postgres credentials.
# - Terminate TLS in front of the stack (reverse proxy) and serve the
#   frontend over HTTPS so JWTs in transit are protected.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-shopsmart}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-key}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "*"
      DB_NAME: ${DB_NAME:-shopsmart}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: "5432"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
